name: CI

on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      chromadb:
        image: chromadb/chroma:latest
        ports: ['8000:8000']
        env:
          IS_PERSISTENT: 'TRUE'
          ANONYMIZED_TELEMETRY: 'FALSE'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - run: cd server && npm ci
      - run: cd server && cp .env.example .env
      - run: cd server && npm run typecheck
      - run: cd server && npm test
        env:
          CHROMA_URL: http://localhost:8000
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: nodomia/package-lock.json

      - run: cd nodomia && npm ci
      - run: cd nodomia && npm run validate:data
      - run: cd nodomia && npm run check-types
      - run: cd nodomia && xvfb-run -a npm test
